<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>


  <section class="page-title">
    <h1>محصولات</h1>
    <a href="index.html" class="breadcrumb">خانه /</a>
  </section>

  <section class="filter-bar">
    <div class="filter-chip active">همه</div>
    <div class="filter-chip">پوست</div>
    <div class="filter-chip">مو</div>
    <div class="filter-chip">آرایش</div>
    <div class="filter-chip">عطر</div>
  </section>

  <section class="sort-bar">
    <span id="product-count">در حال بارگذاری...</span>
    <select class="sort-select" id="sort-select">
      <option value="default">مرتب‌سازی: پیش‌فرض</option>
      <option value="cheap">ارزان‌ترین</option>
      <option value="expensive">گران‌ترین</option>
    </select>
  </section>

  <section class="section-block">
    <div class="product-grid" id="product-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var allProducts = [];
    var currentCategory = 'همه';
    var grid = document.getElementById('product-grid');
    var countEl = document.getElementById('product-count');
    var sortSelect = document.getElementById('sort-select');

    var catSlugMap = { skin: 'پوست', hair: 'مو', makeup: 'آرایش', perfume: 'عطر' };
    var catFromUrl = new URLSearchParams(window.location.search).get('cat');
    if (catFromUrl && catSlugMap[catFromUrl]) {
      currentCategory = catSlugMap[catFromUrl];
    }

    function renderProducts() {
      var list = allProducts.filter(function (p) {
        if (currentCategory === 'همه') return true;
        return p.category && p.category.name === currentCategory;
      });

      var sortVal = sortSelect.value;
      if (sortVal === 'cheap') {
        list = list.slice().sort(function (a, b) { return getProductMinPrice(a) - getProductMinPrice(b); });
      } else if (sortVal === 'expensive') {
        list = list.slice().sort(function (a, b) { return getProductMinPrice(b) - getProductMinPrice(a); });
      }

      countEl.textContent = toFaDigits(list.length) + ' محصول';

      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:30px 0; color:#888;">هنوز محصولی توی این دسته اضافه نشده</p>';
        return;
      }

      grid.innerHTML = list.map(function (p) {
        var price = getProductMinPrice(p);
        var priceLabel = formatPrice(price) + ' تومان';
        return '' +
          '<a href="product-detail.html?id=' + p.id + '" class="product-card">' +
          '  <div class="product-img"></div>' +
          '  <h3>' + p.name + '</h3>' +
          '  <div class="price">' + priceLabel + '</div>' +
          '</a>';
      }).join('');
    }

    document.querySelectorAll('.filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.filter-chip').forEach(function (c) {
          c.classList.remove('active');
        });
        chip.classList.add('active');
        currentCategory = chip.textContent.trim();
        renderProducts();
      });
    });
    sortSelect.addEventListener('change', renderProducts);

    apiFetch('/products/public/' + SELLER_ID)
      .then(function (products) {
        allProducts = products;
        document.querySelectorAll('.filter-chip').forEach(function (c) {
          c.classList.toggle('active', c.textContent.trim() === currentCategory);
        });
        renderProducts();
      })
      .catch(function (err) {
        countEl.textContent = '';
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:30px 0; color:#c0392b;">خطا در بارگذاری محصولات: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
