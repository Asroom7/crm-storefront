name: Code check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check api.js
      - name: Check all panel JavaScript
        run: |
          for file in panel/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - run: node scripts/check-html.js
