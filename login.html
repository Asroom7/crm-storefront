<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu" aria-label="منوی اصلی">
    <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
    <a href="login.html">👤 ورود / ثبت‌نام</a><a href="profile.html">📦 سفارش‌های من</a><a href="cart.html">🛍 سبد خرید</a><a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
  </nav>

  <section class="auth-block">
    <h1 class="auth-title">ورود به حساب کاربری</h1>
    <p class="auth-sub">برای ثبت سفارش و پیگیری خریدهایت وارد شو</p>
    <form class="auth-form" id="login-form">
      <p id="auth-error" class="form-error" hidden></p>
      <label for="phone">شماره موبایل</label>
      <input type="tel" inputmode="numeric" autocomplete="tel" id="phone" placeholder="09xxxxxxxxx" required>
      <label for="password">رمز عبور</label>
      <input type="password" autocomplete="current-password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
      <button id="login-btn" class="btn-dark btn-full" type="submit">ورود</button>
    </form>
    <p class="auth-switch">حساب کاربری نداری؟ <a href="register.html">ثبت‌نام کن</a></p>
  </section>

  <footer class="site-footer"><div class="footer-links"><a href="#">تماس با ما</a><a href="#">قوانین بازگشت کالا</a></div><div class="footer-social"><span>📷</span><span>✈️</span><span>💬</span></div></footer>

  <script>
    var existingSession = getCustomerSession();
    if (existingSession) window.location.replace(getRequestedNext('profile.html'));

    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var form = document.getElementById('login-form');
    var loginBtn = document.getElementById('login-btn');
    var errorBox = document.getElementById('auth-error');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var phone = document.getElementById('phone').value.trim();
      var password = document.getElementById('password').value;
      errorBox.hidden = true;
      loginBtn.disabled = true;
      loginBtn.textContent = 'در حال ورود...';

      apiFetch('/auth/customer/login', {
        method: 'POST',
        body: JSON.stringify({ sellerId: SELLER_ID, phone: phone, password: password })
      }).then(function (data) {
        saveCustomerSession(data.token, data.customer);
        window.location.replace(getRequestedNext('index.html'));
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        loginBtn.disabled = false;
        loginBtn.textContent = 'ورود';
      });
    });
  </script>
</body>
</html>
