<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضعیت سفارش</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon">☰</span>
      <div class="logo">Lumière</div>
      <span class="icon">🛍</span>
    </div>
  </header>

  <section class="status-block">
    <div class="status-icon">✓</div>
    <h1>سفارش شما ثبت شد</h1>
    <div class="status-code">کد پیگیری سفارش: #10234</div>

    <div class="status-pending">
      <span class="status-badge">در انتظار تایید</span>
      <p>رسید پرداخت شما دریافت شد و در حال بررسی توسط تیم ماست. به محض تایید، پیامک اطلاع‌رسانی برای شما ارسال می‌شود.</p>
    </div>

    <a href="index.html" class="btn-dark btn-full">بازگشت به صفحه اصلی</a>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

</body>
</html>
