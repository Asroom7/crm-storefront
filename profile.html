<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب کاربری</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>requireCustomerAuth();</script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>

  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>

  <section class="profile-head">
    <div class="profile-avatar" id="profile-avatar">س</div>
    <div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-phone" id="profile-phone"></div>
    </div>
  </section>

  <section class="section-block">
    <div class="section-head">
      <h2>سفارش‌های من</h2>
    </div>
    <div id="orders-list">
      <p style="color:#888; padding:10px 0;">در حال بارگذاری...</p>
    </div>
  </section>

  <section class="section-block">
    <div class="section-head">
      <h2>اطلاعات حساب</h2>
    </div>
    <div class="account-list">
      <a href="#" class="account-row">✏️ ویرایش اطلاعات شخصی</a>
      <a href="#" class="account-row">📍 آدرس‌های من</a>
      <a href="#" class="account-row">🔒 تغییر رمز عبور</a>
      <a href="index.html" class="account-row logout" onclick="logoutCustomer()">🚪 خروج از حساب</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var session = getCustomerSession();
    if (session) {
      var fullName = session.customer.firstName || '';
      document.getElementById('profile-name').textContent = fullName || 'کاربر';
      document.getElementById('profile-avatar').textContent = fullName ? fullName[0] : '؟';
      document.getElementById('profile-phone').textContent = session.customer.phone || '';
    }

    var ordersList = document.getElementById('orders-list');
    apiFetch('/orders/mine')
      .then(function (orders) {
        if (orders.length === 0) {
          ordersList.innerHTML = '<p style="color:#888; padding:10px 0;">هنوز سفارشی ثبت نکردی.</p>';
          return;
        }
        ordersList.innerHTML = orders.map(function (o) {
          var dateStr = new Date(o.createdAt).toLocaleDateString('fa-IR-u-ca-persian');
          var badgeClass = o.status === 'confirmed' || o.status === 'shipped' ? 'done' : (o.status === 'rejected' ? 'rejected' : 'pending');
          return '' +
            '<a href="order-status.html?id=' + o.id + '" class="order-item">' +
            '  <div>' +
            '    <div class="order-id">سفارش #' + o.id + '</div>' +
            '    <div class="order-date">' + dateStr + '</div>' +
            '  </div>' +
            '  <span class="status-badge small ' + badgeClass + '">' + getOrderStatusLabel(o.status) + '</span>' +
            '</a>';
        }).join('');
      })
      .catch(function (err) {
        ordersList.innerHTML = '<p style="color:#c0392b; padding:10px 0;">خطا: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
