<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>

  <section class="page-title">
    <h1>محصولات</h1>
    <a href="index.html" class="breadcrumb">خانه /</a>
  </section>

  <section class="filter-bar">
    <div class="filter-chip active">همه</div>
    <div class="filter-chip">پوست</div>
    <div class="filter-chip">مو</div>
    <div class="filter-chip">آرایش</div>
    <div class="filter-chip">عطر</div>
  </section>

  <section class="sort-bar">
    <span>۴ محصول</span>
    <select class="sort-select">
      <option>مرتب‌سازی: پیش‌فرض</option>
      <option>ارزان‌ترین</option>
      <option>گران‌ترین</option>
      <option>پرفروش‌ترین</option>
    </select>
  </section>

  <section class="section-block">
    <div class="product-grid">
      <a href="product-detail.html" class="product-card">
        <div class="product-img">
          <span class="badge badge-dark">پرفروش</span>
        </div>
        <h3>سرم ویتامین C</h3>
        <div class="rating">★★★★☆ <span>(۴۲)</span></div>
        <div class="price">۲۸۰,۰۰۰ تومان</div>
      </a>

      <a href="product-detail.html" class="product-card">
        <div class="product-img">
          <span class="badge badge-pink">۲۰٪</span>
        </div>
        <h3>رژ لب مخملی</h3>
        <div class="rating">★★★★☆ <span>(۲۸)</span></div>
        <div class="price">۹۸,۰۰۰ <s>۱۲۲,۰۰۰</s></div>
      </a>

      <a href="product-detail.html" class="product-card">
        <div class="product-img"></div>
        <h3>کرم آبرسان روز</h3>
        <div class="rating">★★★★★ <span>(۱۵)</span></div>
        <div class="price">۱۵۰,۰۰۰ تومان</div>
      </a>

      <a href="product-detail.html" class="product-card">
        <div class="product-img">
          <span class="badge badge-pink">۱۵٪</span>
        </div>
        <h3>شامپو ضدریزش مو</h3>
        <div class="rating">★★★★☆ <span>(۹)</span></div>
        <div class="price">۱۷۵,۰۰۰ <s>۲۰۵,۰۰۰</s></div>
      </a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.filter-chip').forEach(function (c) {
          c.classList.remove('active');
        });
        chip.classList.add('active');
      });
    });
  </script>
</body>
</html>
