<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>requireSellerAuth();</script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <div>
      <div class="admin-store-name">Lumière</div>
      <div class="admin-store-tag">پنل مدیریت فروشگاه</div>
    </div>
    <span class="icon">🔔</span>
  </header>

  <section class="admin-stats">
    <div class="stat-card">
      <div class="stat-label">فروش امروز</div>
      <div class="stat-value" id="stat-sales">... <span>ت</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">سفارش امروز</div>
      <div class="stat-value" id="stat-new-orders">...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">مشتری جدید</div>
      <div class="stat-value" id="stat-new-customers">...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">در انتظار تایید</div>
      <div class="stat-value warn" id="stat-pending">...</div>
    </div>
  </section>

  <section class="admin-section">
    <div class="section-head">
      <h2>سفارش‌های اخیر</h2>
      <a href="admin-orders.html">مشاهده همه</a>
    </div>
    <div id="recent-orders">
      <p style="color:#888; padding:10px 0;">در حال بارگذاری...</p>
    </div>
  </section>

  <section class="admin-section">
    <div class="section-head">
      <h2>محصولات کم‌موجود</h2>
      <a href="admin-products.html">مدیریت محصولات</a>
    </div>
    <div id="low-stock-list">
      <p style="color:#888; padding:10px 0;">در حال بارگذاری...</p>
    </div>
  </section>

  <nav class="admin-tabbar">
    <a href="admin-dashboard.html" class="tab active">
      <span>🏠</span>داشبورد
    </a>
    <a href="admin-products.html" class="tab">
      <span>🧴</span>محصولات
    </a>
    <a href="admin-orders.html" class="tab">
      <span>🧾</span>سفارش‌ها
    </a>
    <a href="admin-customers.html" class="tab">
      <span>👥</span>مشتریان
    </a>
    <a href="admin-settings.html" class="tab">
      <span>⚙️</span>تنظیمات
    </a>
  </nav>

  <script>
    function isToday(dateStr) {
      var d = new Date(dateStr);
      var now = new Date();
      return d.toDateString() === now.toDateString();
    }

    Promise.all([
      sellerApiFetch('/orders/seller'),
      sellerApiFetch('/customers'),
      sellerApiFetch('/products')
    ]).then(function (results) {
      var orders = results[0], customers = results[1], products = results[2];

      var todaySales = orders
        .filter(function (o) { return (o.status === 'confirmed' || o.status === 'shipped') && isToday(o.updatedAt); })
        .reduce(function (sum, o) { return sum + o.totalAmount; }, 0);
      document.getElementById('stat-sales').innerHTML = formatPrice(todaySales) + ' <span>ت</span>';

      var todayOrders = orders.filter(function (o) { return isToday(o.createdAt); }).length;
      document.getElementById('stat-new-orders').textContent = toFaDigits(todayOrders);

      var todayCustomers = customers.filter(function (c) { return isToday(c.createdAt); }).length;
      document.getElementById('stat-new-customers').textContent = toFaDigits(todayCustomers);

      var pendingCount = orders.filter(function (o) { return o.status === 'pending_review'; }).length;
      document.getElementById('stat-pending').textContent = toFaDigits(pendingCount);

      var recentBox = document.getElementById('recent-orders');
      var recent = orders.slice(0, 3);
      if (recent.length === 0) {
        recentBox.innerHTML = '<p style="color:#888; padding:10px 0;">هنوز سفارشی ثبت نشده</p>';
      } else {
        recentBox.innerHTML = recent.map(function (o) {
          var badgeClass = o.status === 'confirmed' || o.status === 'shipped' ? 'done' : (o.status === 'rejected' ? 'rejected' : 'pending');
          var customerName = o.customer ? (o.customer.firstName + ' ' + o.customer.lastName) : 'مشتری';
          return '' +
            '<a href="admin-order-detail.html?id=' + o.id + '" class="admin-order-row">' +
            '  <div>' +
            '    <div class="order-id">سفارش #' + o.id + '</div>' +
            '    <div class="order-date">' + customerName + ' · ' + toFaDigits(o.items.length) + ' محصول</div>' +
            '  </div>' +
            '  <div class="admin-order-end">' +
            '    <span class="status-badge small ' + badgeClass + '">' + getOrderStatusLabel(o.status) + '</span>' +
            '    <div class="order-amount">' + formatPrice(o.totalAmount) + ' ت</div>' +
            '  </div>' +
            '</a>';
        }).join('');
      }

      var lowStockBox = document.getElementById('low-stock-list');
      var lowStock = products.filter(function (p) { return p.stockQty <= p.lowStockAt; });
      if (lowStock.length === 0) {
        lowStockBox.innerHTML = '<p style="color:#888; padding:10px 0;">همه محصولات موجودی کافی دارن</p>';
      } else {
        lowStockBox.innerHTML = lowStock.map(function (p) {
          return '<div class="low-stock-row"><span>' + p.name + '</span><span class="stock-tag">' + toFaDigits(p.stockQty) + ' عدد باقی‌مانده</span></div>';
        }).join('');
      }
    }).catch(function (err) {
      document.getElementById('recent-orders').innerHTML = '<p style="color:#c0392b;">خطا: ' + err.message + '</p>';
    });
  </script>
</body>
</html>
