<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سرم ویتامین C</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>


  <section class="page-title">
    <a href="index.html" class="breadcrumb">خانه</a> <a href="products.html" class="breadcrumb">/ محصولات /</a>
  </section>

  <section class="detail-block" id="detail-block">
    <div class="detail-img" id="detail-img"></div>

    <h1 class="detail-title" id="detail-title">در حال بارگذاری...</h1>
    <div class="detail-price" id="detail-price"></div>

    <p class="detail-desc" id="detail-desc"></p>

    <div class="qty-row">
      <span>تعداد:</span>
      <div class="qty-control">
        <button class="qty-btn">−</button>
        <span>۱</span>
        <button class="qty-btn">+</button>
      </div>
    </div>

    <button id="add-to-cart-btn" class="btn-dark btn-full">افزودن به سبد خرید</button>
  </section>

  <section class="section-block">
    <div class="section-head">
      <h2>نظرات مشتریان</h2>
    </div>
    <p style="color:#888; padding:10px 0;">هنوز نظری برای این محصول ثبت نشده.</p>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var count = 1;
    var currentProduct = null;

    document.querySelectorAll('.qty-control').forEach(function (control) {
      var display = control.querySelector('span');
      var btns = control.querySelectorAll('.qty-btn');
      btns[0].addEventListener('click', function () {
        if (count > 1) { count--; display.textContent = toFaDigits(count); }
      });
      btns[1].addEventListener('click', function () {
        count++; display.textContent = toFaDigits(count);
      });
    });

    var productId = Number(new URLSearchParams(window.location.search).get('id'));
    var addBtn = document.getElementById('add-to-cart-btn');

    if (!productId) {
      document.getElementById('detail-title').textContent = 'محصول پیدا نشد';
      addBtn.style.display = 'none';
    } else {
      apiFetch('/products/public/' + SELLER_ID + '/' + productId)
        .then(function (product) {
          currentProduct = product;
          document.title = product.name;
          document.getElementById('detail-title').textContent = product.name;
          document.getElementById('detail-price').textContent = formatPrice(getProductMinPrice(product)) + ' تومان';
          document.getElementById('detail-desc').textContent = product.description || '';
        })
        .catch(function (err) {
          document.getElementById('detail-title').textContent = 'محصول پیدا نشد';
          document.getElementById('detail-desc').textContent = err.message;
          addBtn.style.display = 'none';
        });

      addBtn.addEventListener('click', function () {
        if (!currentProduct) return;
        addToCart(currentProduct.id, count);
        window.location.href = 'cart.html';
      });
    }
  </script>
</body>
</html>
