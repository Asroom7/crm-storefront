<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضعیت سفارش</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>requireCustomerAuth();</script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu" aria-label="منوی اصلی">
    <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
    <a href="profile.html">👤 حساب کاربری</a><a href="profile.html">📦 سفارش‌های من</a><a href="cart.html">🛍 سبد خرید</a><a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
  </nav>

  <section class="status-block">
    <div class="status-icon" id="status-icon">…</div>
    <h1 id="status-title">در حال بارگذاری...</h1>
    <div class="status-code" id="status-code"></div>

    <div class="status-pending" id="status-pending" style="display:none;">
      <span class="status-badge" id="status-badge"></span>
      <p id="status-desc"></p>
    </div>

    <div class="order-summary-card" id="support-card" hidden></div>
    <div class="order-summary-card" id="order-summary" hidden></div>
    <div id="continue-payment-wrap" hidden><a href="checkout.html" class="btn-dark btn-full" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">ادامه پرداخت و ثبت رسید</a></div>
    <a href="profile.html" class="btn-outline btn-full">مشاهده همه سفارش‌ها</a>
    <a href="index.html" class="btn-dark btn-full status-home-btn">بازگشت به صفحه اصلی</a>
  </section>

  <footer class="site-footer"><div class="footer-links"><a href="#">تماس با ما</a><a href="#">قوانین بازگشت کالا</a></div><div class="footer-social"><span>📷</span><span>✈️</span><span>💬</span></div></footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var statusDescriptions = {
      pending_payment: 'مبلغ پرداخت برای سفارش رزرو شده است. پرداخت را انجام بده و تصویر رسید را ثبت کن.',
      pending_review: 'رسید پرداخت شما دریافت شده و در انتظار بررسی فروشگاه است.',
      paid: 'پرداخت این سفارش ثبت شده است.',
      confirmed: 'سفارش تایید شد و در حال آماده‌سازی برای ارسال است.',
      shipped: 'سفارش شما ارسال شد.',
      rejected: 'پرداخت این سفارش تایید نشد. برای بررسی بیشتر با پشتیبانی تماس بگیرید.',
      cancelled: 'این سفارش لغو شده است.'
    };

    var orderId = Number(new URLSearchParams(window.location.search).get('id'));

    function statusLabel(order) {
      if (order.status === 'pending_payment') return 'در انتظار پرداخت';
      if (order.status === 'pending_review') return 'در انتظار تایید';
      if (order.status === 'confirmed' || order.status === 'paid') return 'سفارش تایید شد';
      if (order.status === 'shipped') return 'سفارش ارسال شد';
      if (order.status === 'rejected') return 'پرداخت رد شد';
      if (order.status === 'cancelled' && order.transaction && order.transaction.status === 'expired') return 'مهلت پرداخت تمام شد';
      return getOrderStatusLabel(order.status);
    }

    function statusVisual(order) {
      if (order.status === 'cancelled' && order.transaction && order.transaction.status === 'expired') return { icon: '⌛', title: 'مهلت پرداخت تمام شد', className: 'rejected' };
      if (order.status === 'rejected' || order.status === 'cancelled') return { icon: '✕', title: 'سفارش تایید نشد', className: 'rejected' };
      if (order.status === 'shipped') return { icon: '✓', title: 'سفارش ارسال شد', className: 'done' };
      if (order.status === 'confirmed' || order.status === 'paid') return { icon: '✓', title: 'سفارش تایید شد', className: 'done' };
      if (order.status === 'pending_payment') return { icon: '💳', title: 'در انتظار پرداخت', className: 'pending' };
      return { icon: '⏳', title: 'در انتظار تایید پرداخت', className: 'pending' };
    }

    function renderSupport(config, status) {
      var seller = config && config.seller ? config.seller : {};
      var rubikaUrl = seller.supportRubikaUrl || 'https://rubika.ir/tebolnovin';
      var phone = seller.supportPhone || '';
      var showPhone = status === 'confirmed' || status === 'paid' || status === 'shipped' || status === 'rejected';
      var lines = [];
      lines.push('<a href="' + escapeHtml(rubikaUrl) + '" target="_blank" rel="noopener noreferrer" class="btn-dark btn-full" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:10px;">💬 ورود مستقیم به چت پشتیبانی روبیکا</a>');
      if (showPhone && phone) lines.push('<div class="order-summary-meta"><span>شماره پشتیبانی</span><a href="tel:' + escapeHtml(String(phone).replace(/[^+\\d]/g, '')) + '" dir="ltr" style="unicode-bidi:isolate;font-weight:700;">' + escapeHtml(phone) + '</a></div>');
      var box = document.getElementById('support-card');
      box.innerHTML = '<h2>پشتیبانی سفارش</h2>' + lines.join('');
      box.hidden = false;
    }

    function renderOrderSummary(order) {
      var box = document.getElementById('order-summary');
      var items = Array.isArray(order.items) ? order.items : [];
      var itemsHtml = items.map(function (item) {
        return '<div class="order-summary-item"><span>' + escapeHtml(item.product ? item.product.name : 'محصول') + ' × ' + toFaDigits(item.quantity) + '</span></div>';
      }).join('');
      var transaction = order.transaction || {};
      var meta = transaction.rawResponse || {};
      var payableAmount = Number(meta.payableAmount || transaction.amount || order.totalAmount || 0);
      var discountAmount = Number(meta.discountAmount || 0);
      var tracking = transaction.refId || '';
      var receiptUrl = meta.receiptUrl ? safeMediaUrl(meta.receiptUrl) : '';
      box.innerHTML = '<h2>جزئیات سفارش</h2>' + itemsHtml +
        (discountAmount > 0 ? '<div class="order-summary-meta"><span>تخفیف اختصاصی پرداخت</span><strong>' + formatPrice(discountAmount) + ' تومان</strong></div>' : '') +
        '<div class="order-summary-total"><span>مبلغ واریزی</span><strong>' + formatPrice(payableAmount) + ' تومان</strong></div>' +
        (tracking ? '<div class="order-summary-meta"><span>شماره پیگیری پرداخت</span><strong dir="ltr" style="unicode-bidi:isolate;">' + escapeHtml(tracking) + '</strong></div>' : '') +
        (receiptUrl ? '<div class="order-summary-meta" style="display:block;"><span style="display:block;margin-bottom:8px;">تصویر رسید پرداخت</span><a href="' + escapeHtml(receiptUrl) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(receiptUrl) + '" alt="رسید پرداخت" style="display:block;max-width:100%;max-height:300px;margin:auto;border-radius:12px;object-fit:contain;"></a></div>' : '') +
        '<div class="order-summary-meta"><span>آدرس ارسال</span><strong>' + escapeHtml(order.shippingAddress || '') + '</strong></div>';
      box.hidden = false;
    }

    if (!Number.isInteger(orderId) || orderId <= 0) {
      document.getElementById('status-title').textContent = 'سفارشی پیدا نشد';
      document.getElementById('status-icon').textContent = '✕';
    } else {
      apiFetch('/orders/mine/' + orderId)
        .then(function (order) {
          var visual = statusVisual(order);
          document.getElementById('status-title').textContent = visual.title;
          document.getElementById('status-icon').textContent = visual.icon;
          document.getElementById('status-icon').className = 'status-icon ' + visual.className;
          document.getElementById('status-code').textContent = 'کد سفارش: #' + order.id;

          var pendingBox = document.getElementById('status-pending');
          pendingBox.style.display = '';
          document.getElementById('status-badge').textContent = statusLabel(order);
          document.getElementById('status-badge').className = 'status-badge ' + visual.className;
          var desc = statusDescriptions[order.status] || 'وضعیت سفارش در حال به‌روزرسانی است.';
          if (order.status === 'cancelled' && order.transaction && order.transaction.status === 'expired') desc = 'مهلت مبلغ رزروشده تمام شده است. برای خرید دوباره از سبد سفارش جدید بسازید.';
          document.getElementById('status-desc').textContent = desc;
          document.getElementById('continue-payment-wrap').hidden = order.status !== 'pending_payment';
          renderOrderSummary(order);
          fetchStoreConfig().then(function (config) { renderSupport(config, order.status); }).catch(function () { renderSupport(null, order.status); });
        })
        .catch(function (err) {
          document.getElementById('status-title').textContent = 'خطا در بارگذاری سفارش';
          document.getElementById('status-icon').textContent = '✕';
          document.getElementById('status-code').textContent = err.message;
        });
    }
  </script>
</body>
</html>
