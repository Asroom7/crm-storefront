<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>محصولات</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="products-filters-pro.css?v=20261009-v1">
  <script src="api.js"></script>
</head>
<body>
  <header class="site-header"><div class="header-top"><span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span><div class="logo">Lumière</div><a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a></div></header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu" aria-label="منوی اصلی">
    <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
    <a href="login.html">👤 ورود / ثبت‌نام</a><a href="profile.html">📦 سفارش‌های من</a><a href="cart.html">🛍 سبد خرید</a><a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
  </nav>

  <section class="page-title"><a href="index.html" class="breadcrumb">خانه /</a></section>

  <main class="products-pro-page">
    <div class="products-pro-head">
      <div><h1>محصولات</h1><p>جستجو و فیلتر کن تا سریع‌تر به محصول مناسب برسی.</p></div>
      <label class="products-pro-search" aria-label="جستجوی محصولات"><span>⌕</span><input id="products-search" type="search" placeholder="جستجوی نام، توضیحات یا دسته‌بندی..." autocomplete="off"></label>
    </div>

    <div class="products-pro-layout">
      <aside class="products-filter-panel" id="products-filter-panel" aria-label="فیلتر محصولات">
        <div class="products-filter-head">
          <strong>فیلترها</strong>
          <div style="display:flex;align-items:center;gap:7px;">
            <button type="button" class="products-filter-reset" id="products-reset">پاک کردن همه</button>
            <button type="button" class="products-filter-reset" id="products-filter-close" style="display:none;" aria-label="بستن فیلتر">بستن</button>
          </div>
        </div>

        <div class="products-filter-group">
          <strong>دسته‌بندی</strong>
          <div class="products-filter-categories" id="products-category-options"></div>
        </div>

        <div class="products-filter-group">
          <strong>وضعیت موجودی</strong>
          <div class="products-filter-options" id="products-availability-options">
            <button type="button" class="active" data-availability="all">همه</button>
            <button type="button" data-availability="in">موجود</button>
            <button type="button" data-availability="low">رو به اتمام</button>
            <button type="button" data-availability="out">ناموجود</button>
          </div>
        </div>

        <div class="products-filter-group">
          <strong>بازه قیمت</strong>
          <div class="products-price-grid">
            <label><span>از قیمت</span><input id="products-min-price" type="text" inputmode="numeric" placeholder="۰"></label>
            <label><span>تا قیمت</span><input id="products-max-price" type="text" inputmode="numeric" placeholder="بدون سقف"></label>
          </div>
        </div>
      </aside>

      <section class="products-results">
        <div class="products-toolbar">
          <div class="products-count" id="products-count">در حال بارگذاری...</div>
          <div class="products-toolbar-actions">
            <button type="button" class="products-mobile-filter" id="products-mobile-filter">فیلترها</button>
            <select class="products-sort" id="products-sort" aria-label="مرتب‌سازی محصولات">
              <option value="newest">جدیدترین</option>
              <option value="bestseller">پرفروش‌ترین</option>
              <option value="cheap">ارزان‌ترین</option>
              <option value="expensive">گران‌ترین</option>
            </select>
          </div>
        </div>
        <div class="products-active-filters" id="products-active-filters"></div>
        <div class="products-grid" id="products-grid"></div>
      </section>
    </div>

    <div class="products-filter-backdrop" id="products-filter-backdrop"></div>
  </main>

  <footer class="site-footer"><div class="footer-links"><a href="#">تماس با ما</a><a href="#">قوانین بازگشت کالا</a></div><div class="footer-social"><span>📷</span><span>✈️</span><span>💬</span></div></footer>

  <script src="products-filters-pro.js?v=20261009-v1"></script>
</body>
</html>
