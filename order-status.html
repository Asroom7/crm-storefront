<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضعیت سفارش</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>requireCustomerAuth();</script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>


  <section class="status-block">
    <div class="status-icon" id="status-icon">✓</div>
    <h1 id="status-title">در حال بارگذاری...</h1>
    <div class="status-code" id="status-code"></div>

    <div class="status-pending" id="status-pending" style="display:none;">
      <span class="status-badge" id="status-badge"></span>
      <p id="status-desc"></p>
    </div>

    <a href="index.html" class="btn-dark btn-full">بازگشت به صفحه اصلی</a>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var statusDescriptions = {
      pending_review: 'رسید پرداخت شما دریافت شد و در حال بررسی توسط فروشگاه است. به محض تایید، وضعیت سفارش به‌روز می‌شود.',
      confirmed: 'پرداخت شما تایید شد و سفارشتون در حال آماده‌سازیه.',
      shipped: 'سفارش شما ارسال شد.',
      rejected: 'متاسفانه پرداخت این سفارش تایید نشد. اگه فکر می‌کنی اشتباهیه، با پشتیبانی تماس بگیر.'
    };

    var orderId = new URLSearchParams(window.location.search).get('id');

    if (!orderId) {
      document.getElementById('status-title').textContent = 'سفارشی پیدا نشد';
    } else {
      apiFetch('/orders/mine/' + orderId)
        .then(function (order) {
          document.getElementById('status-title').textContent =
            order.status === 'rejected' ? 'سفارش شما تایید نشد' : 'سفارش شما ثبت شد';
          document.getElementById('status-icon').textContent = order.status === 'rejected' ? '✕' : '✓';
          document.getElementById('status-code').textContent = 'کد پیگیری سفارش: #' + order.id;

          var pendingBox = document.getElementById('status-pending');
          pendingBox.style.display = '';
          document.getElementById('status-badge').textContent = getOrderStatusLabel(order.status);
          document.getElementById('status-badge').className = 'status-badge ' + (order.status === 'rejected' ? 'rejected' : '');
          document.getElementById('status-desc').textContent = statusDescriptions[order.status] || '';
        })
        .catch(function (err) {
          document.getElementById('status-title').textContent = 'خطا در بارگذاری سفارش';
          document.getElementById('status-code').textContent = err.message;
        });
    }
  </script>
</body>
</html>
