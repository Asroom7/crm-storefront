<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>


  <section class="page-title">
    <h1>سبد خرید شما</h1>
    <a href="index.html" class="breadcrumb">خانه</a> <a href="products.html" class="breadcrumb">/ محصولات /</a>
  </section>

  <section class="cart-block" id="cart-block">
    <div id="cart-items"></div>

    <div class="cart-summary" id="cart-summary" style="display:none;">
      <div class="summary-row">
        <span>جمع کالاها</span>
        <span id="sum-subtotal"></span>
      </div>
      <div class="summary-row">
        <span>هزینه ارسال</span>
        <span class="free-tag">رایگان</span>
      </div>
      <div class="summary-row total">
        <span>مبلغ قابل پرداخت</span>
        <span id="sum-total"></span>
      </div>
    </div>

    <a href="checkout.html" class="btn-dark btn-full" id="checkout-btn" style="display:none;">ادامه فرآیند خرید</a>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var itemsBox = document.getElementById('cart-items');
    var summaryBox = document.getElementById('cart-summary');
    var checkoutBtn = document.getElementById('checkout-btn');

    function renderEmpty() {
      itemsBox.innerHTML = '<p style="text-align:center; padding:40px 0; color:#888;">سبد خریدت خالیه.<br><a href="products.html">برو محصولات رو ببین</a></p>';
      summaryBox.style.display = 'none';
      checkoutBtn.style.display = 'none';
    }

    function renderCart(products) {
      var cart = getCart();
      // حذف آیتم‌هایی که محصولشون دیگه وجود نداره یا منتشر نیست
      var cartItems = cart.map(function (ci) {
        var product = products.find(function (p) { return p.id === ci.productId; });
        return product ? { product: product, quantity: ci.quantity } : null;
      }).filter(Boolean);

      if (cartItems.length === 0) {
        renderEmpty();
        return;
      }

      var subtotal = 0;
      itemsBox.innerHTML = cartItems.map(function (ci) {
        var unitPrice = getProductMinPrice(ci.product);
        subtotal += unitPrice * ci.quantity;
        return '' +
          '<div class="cart-item" data-id="' + ci.product.id + '">' +
          '  <div class="cart-item-img"></div>' +
          '  <div class="cart-item-info">' +
          '    <h3>' + ci.product.name + '</h3>' +
          '    <div class="price">' + formatPrice(unitPrice) + ' تومان</div>' +
          '  </div>' +
          '  <div class="qty-control small">' +
          '    <button class="qty-btn qty-minus">−</button>' +
          '    <span>' + toFaDigits(ci.quantity) + '</span>' +
          '    <button class="qty-btn qty-plus">+</button>' +
          '  </div>' +
          '</div>';
      }).join('');

      summaryBox.style.display = '';
      checkoutBtn.style.display = '';
      document.getElementById('sum-subtotal').textContent = formatPrice(subtotal) + ' تومان';
      document.getElementById('sum-total').textContent = formatPrice(subtotal) + ' تومان';

      itemsBox.querySelectorAll('.cart-item').forEach(function (row) {
        var id = Number(row.dataset.id);
        var display = row.querySelector('.qty-control span');
        var current = cartItems.find(function (ci) { return ci.product.id === id; }).quantity;

        row.querySelector('.qty-minus').addEventListener('click', function () {
          current--;
          updateCartQuantity(id, current);
          renderCart(products);
        });
        row.querySelector('.qty-plus').addEventListener('click', function () {
          current++;
          updateCartQuantity(id, current);
          renderCart(products);
        });
      });
    }

    checkoutBtn.addEventListener('click', function (e) {
      if (!getCustomerSession()) {
        e.preventDefault();
        window.location.href = 'login.html';
      }
    });

    var cart = getCart();
    if (cart.length === 0) {
      renderEmpty();
    } else {
      apiFetch('/products/public/' + SELLER_ID)
        .then(renderCart)
        .catch(function (err) {
          itemsBox.innerHTML = '<p style="text-align:center; padding:40px 0; color:#c0392b;">خطا در بارگذاری سبد خرید: ' + err.message + '</p>';
        });
    }
  </script>
</body>
</html>
