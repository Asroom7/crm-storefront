<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-top"><span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span><div class="logo">Lumière</div><a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a></div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu" aria-label="منوی اصلی">
    <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
    <a href="login.html">👤 ورود / ثبت‌نام</a><a href="profile.html">📦 سفارش‌های من</a><a href="cart.html">🛍 سبد خرید</a><a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
  </nav>

  <section class="auth-block">
    <h1 class="auth-title">ساخت حساب کاربری</h1>
    <p class="auth-sub">برای شروع خرید، اطلاعاتت رو وارد کن</p>
    <form class="auth-form" id="register-form">
      <p id="auth-error" class="form-error" hidden></p>
      <label for="first-name">نام</label><input type="text" id="first-name" autocomplete="given-name" placeholder="نام" required maxlength="100">
      <label for="last-name">نام خانوادگی</label><input type="text" id="last-name" autocomplete="family-name" placeholder="نام خانوادگی" required maxlength="100">
      <label for="phone">شماره موبایل</label><input type="tel" inputmode="numeric" autocomplete="tel" id="phone" placeholder="09xxxxxxxxx" required>
      <label for="password">رمز عبور</label><input type="password" autocomplete="new-password" id="password" minlength="6" maxlength="200" placeholder="حداقل ۶ کاراکتر" required>
      <button id="register-btn" class="btn-dark btn-full" type="submit">ثبت‌نام</button>
    </form>
    <p class="auth-switch">حساب کاربری داری؟ <a href="login.html">وارد شو</a></p>
  </section>

  <footer class="site-footer"><div class="footer-links"><a href="#">تماس با ما</a><a href="#">قوانین بازگشت کالا</a></div><div class="footer-social"><span>📷</span><span>✈️</span><span>💬</span></div></footer>

  <script>
    var existingSession = getCustomerSession();
    if (existingSession) window.location.replace(getRequestedNext('profile.html'));

    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var form = document.getElementById('register-form');
    var registerBtn = document.getElementById('register-btn');
    var errorBox = document.getElementById('auth-error');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      errorBox.hidden = true;
      var payload = {
        sellerId: SELLER_ID,
        firstName: document.getElementById('first-name').value.trim(),
        lastName: document.getElementById('last-name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value
      };

      registerBtn.disabled = true;
      registerBtn.textContent = 'در حال ثبت‌نام...';
      apiFetch('/auth/customer/register', {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(function (data) {
        saveCustomerSession(data.token, data.customer);
        window.location.replace(getRequestedNext('index.html'));
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        registerBtn.disabled = false;
        registerBtn.textContent = 'ثبت‌نام';
      });
    });
  </script>
</body>
</html>
