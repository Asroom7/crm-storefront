<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>


  <section class="auth-block">
    <h1 class="auth-title">ورود به حساب کاربری</h1>
    <p class="auth-sub">برای ثبت سفارش و پیگیری خریدهایت وارد شو</p>

    <div class="auth-form">
      <p id="auth-error" style="color:#c0392b; display:none; margin-bottom:10px;"></p>

      <label>شماره موبایل</label>
      <input type="text" id="phone" placeholder="09xxxxxxxxx">

      <label>رمز عبور</label>
      <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">

      <button id="login-btn" class="btn-dark btn-full">ورود</button>
    </div>

    <p class="auth-switch">حساب کاربری نداری؟ <a href="register.html">ثبت‌نام کن</a></p>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var loginBtn = document.getElementById('login-btn');
    var errorBox = document.getElementById('auth-error');

    loginBtn.addEventListener('click', function () {
      var phone = document.getElementById('phone').value.trim();
      var password = document.getElementById('password').value;
      errorBox.style.display = 'none';

      if (!phone || !password) {
        errorBox.textContent = 'شماره موبایل و رمز عبور رو وارد کن';
        errorBox.style.display = 'block';
        return;
      }

      loginBtn.textContent = 'در حال ورود...';

      apiFetch('/customer/login', {
        method: 'POST',
        body: JSON.stringify({ sellerId: SELLER_ID, phone: phone, password: password })
      }).then(function (data) {
        saveCustomerSession(data.token, data.customer);
        window.location.href = 'index.html';
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        loginBtn.textContent = 'ورود';
      });
    });
  </script>
</body>
</html>
