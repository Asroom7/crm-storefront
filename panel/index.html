<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>پنل مدیریت</title>
<meta name="theme-color" content="#0F5257">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="modernize.css">
<script src="../api.js"></script>
<script>requireSellerAuth();</script>
<script>
  (function () {
    try {
      var t = localStorage.getItem('crm-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar__title">پنل مدیریت</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="topbarSearchBtn" style="background:none;border:none;color:inherit;padding:4px;cursor:pointer;display:flex;" aria-label="جستجو"></button>
      <div class="topbar__date" id="topbarDate"></div>
    </div>
  </header>

  <main class="view" id="view"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="app.js"></script>
<script src="modernize.js"></script>
</body>
</html>
