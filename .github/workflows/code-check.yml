name: Code check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check storefront JavaScript
        run: |
          node --check api.js
          node --check cinematic-intro.js
          for file in storefront-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check all panel JavaScript
        run: |
          for file in panel/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check HTML and local assets
        run: node scripts/check-html.js
      - name: Check storefront architecture
        run: node scripts/check-storefront-architecture.js
