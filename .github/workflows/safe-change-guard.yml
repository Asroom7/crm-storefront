name: Safe change guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify approved section locks
        run: node scripts/check-change-scope.js
