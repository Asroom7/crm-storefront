<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon menu-toggle">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>

  <div class="side-menu-overlay"></div>
  <nav class="side-menu">
    <div class="side-menu-head">
      <span class="logo">Lumière</span>
      <span class="icon close-menu">✕</span>
    </div>
    <a href="login.html">👤 ورود / ثبت‌نام</a>
    <a href="profile.html">📦 سفارش‌های من</a>
    <a href="cart.html">🛍 سبد خرید</a>
    <a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
    <a href="products.html?cat=skin">مراقبت پوست</a>
    <a href="products.html?cat=hair">مراقبت مو</a>
    <a href="products.html?cat=makeup">آرایش</a>
    <a href="products.html?cat=perfume">عطر و ادکلن</a>
  </nav>

  <section class="auth-block">
    <h1 class="auth-title">ساخت حساب کاربری</h1>
    <p class="auth-sub">برای شروع خرید، اطلاعاتت رو وارد کن</p>

    <div class="auth-form">
      <p id="auth-error" style="color:#c0392b; display:none; margin-bottom:10px;"></p>

      <label>نام</label>
      <input type="text" id="first-name" placeholder="نام">

      <label>نام خانوادگی</label>
      <input type="text" id="last-name" placeholder="نام خانوادگی">

      <label>شماره موبایل</label>
      <input type="text" id="phone" placeholder="09xxxxxxxxx">

      <label>رمز عبور</label>
      <input type="password" id="password" placeholder="یک رمز عبور بسازید (حداقل ۶ کاراکتر)">

      <button id="register-btn" class="btn-dark btn-full">ثبت‌نام</button>
    </div>

    <p class="auth-switch">حساب کاربری داری؟ <a href="login.html">وارد شو</a></p>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var registerBtn = document.getElementById('register-btn');
    var errorBox = document.getElementById('auth-error');

    registerBtn.addEventListener('click', function () {
      var firstName = document.getElementById('first-name').value.trim();
      var lastName = document.getElementById('last-name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var password = document.getElementById('password').value;
      errorBox.style.display = 'none';

      if (!firstName || !lastName || !phone || !password) {
        errorBox.textContent = 'همه فیلدها رو پر کن';
        errorBox.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorBox.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشه';
        errorBox.style.display = 'block';
        return;
      }

      registerBtn.textContent = 'در حال ثبت‌نام...';

      apiFetch('/customer/register', {
        method: 'POST',
        body: JSON.stringify({
          sellerId: SELLER_ID,
          firstName: firstName,
          lastName: lastName,
          phone: phone,
          password: password
        })
      }).then(function (data) {
        saveCustomerSession(data.token, data.customer);
        window.location.href = 'index.html';
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        registerBtn.textContent = 'ثبت‌نام';
      });
    });
  </script>
</body>
</html>
