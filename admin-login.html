<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body class="admin-body">
  <section class="admin-login-block">
    <div class="admin-login-logo">Lumière</div>
    <div class="admin-login-tag">پنل مدیریت یکپارچه</div>
    <form class="auth-form" id="admin-login-form">
      <p id="auth-error" style="color:#c0392b; display:none; margin-bottom:10px;"></p>
      <label for="phone">شماره موبایل</label>
      <input type="tel" inputmode="numeric" autocomplete="tel" id="phone" placeholder="09xxxxxxxxx" required>
      <label for="password">رمز عبور</label>
      <input type="password" autocomplete="current-password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
      <button id="admin-login-btn" class="btn-dark btn-full" type="submit">ورود به پنل</button>
    </form>
    <p class="admin-login-switch">مشتری هستید؟ <a href="index.html">بازگشت به فروشگاه</a></p>
  </section>

  <script>
    if (getSellerSession()) window.location.replace('panel/index.html');

    var form = document.getElementById('admin-login-form');
    var loginBtn = document.getElementById('admin-login-btn');
    var errorBox = document.getElementById('auth-error');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      errorBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'در حال ورود...';

      apiFetch('/auth/seller/login', {
        method: 'POST',
        body: JSON.stringify({
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value
        })
      }).then(function (data) {
        saveSellerSession(data.token, data.seller);
        window.location.href = 'panel/index.html';
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'ورود به پنل';
      });
    });
  </script>
</body>
</html>
