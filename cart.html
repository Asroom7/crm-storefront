<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
</head>
<body>
  <header class="site-header"><div class="header-top"><span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span><div class="logo">Lumière</div><a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a></div></header>
  <div class="side-menu-overlay"></div>
  <nav class="side-menu" aria-label="منوی اصلی">
    <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
    <a href="login.html">👤 ورود / ثبت‌نام</a><a href="profile.html">📦 سفارش‌های من</a><a href="cart.html">🛍 سبد خرید</a><a href="index.html">🏠 صفحه نخست</a>
    <div class="side-menu-sep"></div>
  </nav>

  <section class="page-title"><h1>سبد خرید شما</h1><a href="index.html" class="breadcrumb">خانه</a> <a href="products.html" class="breadcrumb">/ محصولات /</a></section>
  <section class="cart-block" id="cart-block">
    <div id="cart-items"></div>
    <div class="cart-summary" id="cart-summary" style="display:none;">
      <div class="summary-row"><span>جمع کالاها</span><span id="sum-subtotal"></span></div>
      <div class="summary-row total"><span>جمع فعلی</span><span id="sum-total"></span></div>
      <div class="cart-hint">هزینه ارسال در مرحله تکمیل خرید و بر اساس تنظیمات فروشگاه محاسبه می‌شود.</div>
    </div>
    <a href="checkout.html" class="btn-dark btn-full" id="checkout-btn" style="display:none;">ادامه فرآیند خرید</a>
  </section>
  <footer class="site-footer"><div class="footer-links"><a href="#">تماس با ما</a><a href="#">قوانین بازگشت کالا</a></div><div class="footer-social"><span>📷</span><span>✈️</span><span>💬</span></div></footer>

  <script>
    var toggle = document.querySelector('.menu-toggle');
    var closeBtn = document.querySelector('.close-menu');
    var overlay = document.querySelector('.side-menu-overlay');
    var menu = document.querySelector('.side-menu');
    function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); }
    function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay) overlay.addEventListener('click', closeMenu);

    var itemsBox = document.getElementById('cart-items');
    var summaryBox = document.getElementById('cart-summary');
    var checkoutBtn = document.getElementById('checkout-btn');

    function renderEmpty() {
      itemsBox.innerHTML = '<p style="text-align:center;padding:40px 0;color:#888;">سبد خریدت خالیه.<br><a href="products.html">برو محصولات رو ببین</a></p>';
      summaryBox.style.display = 'none';
      checkoutBtn.style.display = 'none';
    }

    function renderCart(products) {
      var originalCart = getCart();
      var cleanedCart = [];
      var cartItems = originalCart.map(function (ci) {
        var product = products.find(function (p) { return Number(p.id) === Number(ci.productId); });
        var price = product ? getProductMinPrice(product) : 0;
        if (!product || Number(product.stockQty || 0) <= 0 || price <= 0) return null;
        var quantity = Math.min(Math.max(1, Number(ci.quantity) || 1), Number(product.stockQty || 0));
        cleanedCart.push({ productId: product.id, quantity: quantity });
        return { product: product, quantity: quantity };
      }).filter(Boolean);

      if (JSON.stringify(cleanedCart) !== JSON.stringify(originalCart)) saveCart(cleanedCart);
      if (!cartItems.length) { renderEmpty(); return; }

      var subtotal = 0;
      itemsBox.innerHTML = cartItems.map(function (ci) {
        var unitPrice = getProductMinPrice(ci.product);
        subtotal += unitPrice * ci.quantity;
        var imageUrl = getProductImageUrl(ci.product);
        var image = imageUrl ? '<img src="' + escapeHtml(imageUrl) + '" alt="' + escapeHtml(ci.product.name) + '">' : '<span class="product-img-placeholder">بدون تصویر</span>';
        return '<div class="cart-item" data-id="' + ci.product.id + '">' +
          '<div class="cart-item-img">' + image + '</div>' +
          '<div class="cart-item-info"><h3>' + escapeHtml(ci.product.name) + '</h3><div class="price">' + getProductPriceLabel(ci.product) + '</div><div class="cart-stock">موجودی: ' + toFaDigits(ci.product.stockQty) + '</div><button type="button" class="cart-remove">حذف</button></div>' +
          '<div class="qty-control small"><button class="qty-btn qty-minus" type="button" aria-label="کم کردن تعداد">−</button><span>' + toFaDigits(ci.quantity) + '</span><button class="qty-btn qty-plus" type="button" aria-label="زیاد کردن تعداد">+</button></div>' +
          '</div>';
      }).join('');

      summaryBox.style.display = '';
      checkoutBtn.style.display = '';
      document.getElementById('sum-subtotal').textContent = formatPrice(subtotal) + ' تومان';
      document.getElementById('sum-total').textContent = formatPrice(subtotal) + ' تومان';

      itemsBox.querySelectorAll('.cart-item').forEach(function (row) {
        var id = Number(row.dataset.id);
        var currentItem = cartItems.find(function (ci) { return ci.product.id === id; });
        var current = currentItem.quantity;
        row.querySelector('.qty-minus').addEventListener('click', function () { current--; updateCartQuantity(id, current); renderCart(products); });
        row.querySelector('.qty-plus').addEventListener('click', function () {
          if (current < currentItem.product.stockQty) { current++; updateCartQuantity(id, current); renderCart(products); }
        });
        row.querySelector('.cart-remove').addEventListener('click', function () { removeFromCart(id); renderCart(products); });
      });
    }

    checkoutBtn.addEventListener('click', function (event) {
      if (!getCustomerSession()) {
        event.preventDefault();
        window.location.href = 'login.html?next=' + encodeURIComponent('checkout.html');
      }
    });

    var cart = getCart();
    if (!cart.length) renderEmpty();
    else apiFetch('/products/public/' + SELLER_ID).then(renderCart).catch(function (err) {
      itemsBox.innerHTML = '<p style="text-align:center;padding:40px 0;color:#c0392b;">خطا در بارگذاری سبد خرید: ' + escapeHtml(err.message) + '</p>';
    });
  </script>
</body>
</html>
