<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات سفارش</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>requireSellerAuth();</script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <a href="admin-orders.html" class="admin-back">→</a>
    <div>
      <div class="admin-store-name" id="order-title">سفارش</div>
    </div>
    <span></span>
  </header>

  <section class="admin-form-block">
    <p id="order-error" style="color:#c0392b; display:none;"></p>

    <div class="order-detail-status">
      <span class="status-badge" id="order-status-badge"></span>
    </div>

    <div class="card-info">
      <h2>اطلاعات مشتری</h2>
      <div class="card-owner" id="customer-name"></div>
      <div class="card-owner" id="customer-phone"></div>
      <div class="card-owner" id="customer-address"></div>
    </div>

    <div class="card-info">
      <h2>اقلام سفارش</h2>
      <div id="order-items"></div>
      <div class="summary-row total"><span>مبلغ کل</span><span id="order-total"></span></div>
    </div>

    <div class="card-info">
      <h2>رسید پرداخت</h2>
      <div class="card-owner" id="order-tracking">شماره پیگیری: —</div>
    </div>

    <div class="admin-action-row" id="order-actions">
    </div>

  </section>

  <script>
    var orderId = new URLSearchParams(window.location.search).get('id');
    var errorBox = document.getElementById('order-error');
    var actionsBox = document.getElementById('order-actions');
    var currentOrder = null;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function renderActions() {
      if (currentOrder.status === 'pending_review') {
        actionsBox.innerHTML =
          '<button id="confirm-btn" class="btn-dark btn-full">تایید سفارش</button>' +
          '<button id="reject-btn" class="btn-outline btn-full">رد سفارش</button>';
        document.getElementById('confirm-btn').addEventListener('click', function () { doAction('confirm'); });
        document.getElementById('reject-btn').addEventListener('click', function () { doAction('reject'); });
      } else if (currentOrder.status === 'confirmed') {
        actionsBox.innerHTML = '<button id="ship-btn" class="btn-dark btn-full">ثبت ارسال سفارش</button>';
        document.getElementById('ship-btn').addEventListener('click', function () { doAction('ship'); });
      } else {
        actionsBox.innerHTML = '';
      }
    }

    function doAction(action) {
      var label = action === 'confirm' ? 'در حال تایید...' : action === 'reject' ? 'در حال رد کردن...' : 'در حال ثبت...';
      actionsBox.querySelectorAll('button').forEach(function (b) { b.disabled = true; b.textContent = label; });

      sellerApiFetch('/orders/seller/' + orderId + '/' + action, { method: 'POST' })
        .then(function () { window.location.reload(); })
        .catch(function (err) {
          showError(err.message);
          renderActions();
        });
    }

    if (!orderId) {
      showError('سفارشی مشخص نشده');
    } else {
      sellerApiFetch('/orders/seller/' + orderId)
        .then(function (order) {
          currentOrder = order;
          document.getElementById('order-title').textContent = 'سفارش #' + order.id;

          var badge = document.getElementById('order-status-badge');
          badge.textContent = getOrderStatusLabel(order.status);
          badge.className = 'status-badge ' + (order.status === 'pending_review' ? 'pending' : order.status === 'rejected' ? 'rejected' : '');

          document.getElementById('customer-name').textContent = order.customer.firstName + ' ' + order.customer.lastName;
          document.getElementById('customer-phone').textContent = order.customer.phone;
          document.getElementById('customer-address').textContent = order.shippingAddress;

          document.getElementById('order-items').innerHTML = order.items.map(function (it) {
            return '<div class="summary-row"><span>' + it.product.name + ' × ' + toFaDigits(it.quantity) + '</span><span>' + formatPrice(it.price * it.quantity) + ' ت</span></div>';
          }).join('');
          document.getElementById('order-total').textContent = formatPrice(order.totalAmount) + ' ت';

          if (order.transaction) {
            document.getElementById('order-tracking').textContent = 'شماره پیگیری: ' + (order.transaction.refId || '—');
          }

          renderActions();
        })
        .catch(function (err) { showError(err.message); });
    }
  </script>
</body>
</html>
