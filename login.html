<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <span class="icon">☰</span>
      <div class="logo">Lumière</div>
      <a href="cart.html" class="icon">🛍</a>
    </div>
  </header>

  <section class="auth-block">
    <h1 class="auth-title">ورود به حساب کاربری</h1>
    <p class="auth-sub">برای ثبت سفارش و پیگیری خریدهایت وارد شو</p>

    <div class="auth-form">
      <label>شماره موبایل</label>
      <input type="text" placeholder="09xxxxxxxxx">

      <label>رمز عبور</label>
      <input type="password" placeholder="رمز عبور خود را وارد کنید">

      <a href="index.html" class="btn-dark btn-full">ورود</a>
    </div>

    <p class="auth-switch">حساب کاربری نداری؟ <a href="#">ثبت‌نام کن</a></p>
  </section>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">تماس با ما</a>
      <a href="#">قوانین بازگشت کالا</a>
    </div>
    <div class="footer-social">
      <span>📷</span><span>✈️</span><span>💬</span>
    </div>
  </footer>

</body>
</html>
