<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="فروشگاه آنلاین محصولات مراقبتی، آرایشی و زیبایی با جستجوی سریع، دسته‌بندی مرتب و پیگیری سفارش.">
  <meta name="theme-color" content="#fffdfc">
  <title>فروشگاه آرایشی و بهداشتی</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="storefront-home.css?v=20260930-v1">
  <link rel="stylesheet" href="cinematic-intro.css?v=20260925-v9">
  <script src="api.js"></script>
</head>
<body>
  <section id="cinematic-intro" class="cinematic-intro" aria-label="معرفی فروشگاه" tabindex="0">
    <div class="cinematic-intro-media" aria-hidden="true">
      <img class="cinematic-intro-poster" src="assets/beauty-intro-poster.svg" alt="">
      <video class="cinematic-intro-video" autoplay muted playsinline preload="auto" poster="assets/beauty-intro-poster.svg" aria-hidden="true">
        <source src="assets/beauty-intro.mp4" type="video/mp4">
      </video>
      <div class="cinematic-intro-shade"></div>
      <div class="cinematic-intro-glow"></div>
      <div class="cinematic-intro-grain"></div>
    </div>
    <div class="cinematic-intro-copy">
      <p class="cinematic-intro-tagline">درخشش، از مراقبت شروع می‌شود.</p>
      <button type="button" class="cinematic-intro-scroll" aria-label="ورود به فروشگاه">
        <span>صفحه را به پایین بکشید</span>
        <span class="cinematic-intro-arrow" aria-hidden="true"></span>
      </button>
    </div>
    <div class="cinematic-intro-progress" aria-hidden="true"></div>
  </section>

  <div id="storefront-reveal-shell" class="storefront-reveal-shell">
    <header class="site-header">
      <div class="header-top">
        <span class="icon menu-toggle" role="button" tabindex="0" aria-label="باز کردن منو">☰</span>
        <div class="logo">Lumière</div>
        <a href="cart.html" class="icon" aria-label="سبد خرید">🛍</a>
      </div>
    </header>

    <div class="side-menu-overlay"></div>
    <nav class="side-menu" aria-label="منوی اصلی">
      <div class="side-menu-head"><span class="logo">Lumière</span><span class="icon close-menu" role="button" tabindex="0" aria-label="بستن منو">✕</span></div>
      <a href="login.html">👤 ورود / ثبت‌نام</a>
      <a href="profile.html">📦 سفارش‌های من</a>
      <a href="cart.html">🛍 سبد خرید</a>
      <a href="products.html">✦ همه محصولات</a>
      <a href="index.html">🏠 صفحه نخست</a>
      <div class="side-menu-sep"></div>
    </nav>

    <main id="storefront-home-root" tabindex="-1">
      <div class="sf-home-loading sf-container" aria-live="polite">
        <div class="sf-skeleton sf-skeleton-search"></div>
        <div class="sf-skeleton sf-skeleton-hero"></div>
        <div class="sf-skeleton-row"><span></span><span></span><span></span></div>
      </div>
    </main>
  </div>

  <script src="storefront-home.js?v=20260930-v1"></script>
  <script src="cinematic-intro.js?v=20260925-v9"></script>
</body>
</html>
